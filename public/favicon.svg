<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4a38"/>
      <stop offset="100%" stop-color="#0a2e22"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="walletEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Dark emerald background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Cash bills fanning out -->
  <rect x="22" y="4" width="16" height="11" rx="2" transform="rotate(-12 30 9)" fill="#86efac" stroke="#166534" stroke-width="0.8"/>
  <circle cx="29" cy="8.5" r="2.5" fill="#22c55e" transform="rotate(-12 30 9)"/>
  <rect x="25" y="5" width="16" height="11" rx="2" transform="rotate(5 33 10)" fill="#a7f3d0" stroke="#166534" stroke-width="0.8"/>
  <circle cx="33" cy="10" r="2.5" fill="#34d399" transform="rotate(5 33 10)"/>

  <!-- Wallet body -->
  <rect x="8" y="18" width="38" height="28" rx="6" fill="url(#wallet)" stroke="#166534" stroke-width="1.2"/>

  <!-- Wallet fold -->
  <rect x="8" y="18" width="38" height="5" rx="3" fill="url(#walletEdge)" opacity="0.5"/>

  <!-- Wallet clasp -->
  <rect x="40" y="28" width="8" height="8" rx="4" fill="url(#walletEdge)"/>
  <circle cx="44" cy="32" r="1.8" fill="#0f4a38"/>

  <!-- Eyes -->
  <circle cx="20" cy="30" r="2.5" fill="#166534"/>
  <circle cx="20.8" cy="29.2" r="0.8" fill="#ffffff"/>
  <circle cx="32" cy="30" r="2.5" fill="#166534"/>
  <circle cx="32.8" cy="29.2" r="0.8" fill="#ffffff"/>

  <!-- Smile -->
  <path d="M20 36 Q26 41 33 36" stroke="#166534" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Gold coin -->
  <circle cx="48" cy="44" r="7" fill="url(#coin)" stroke="#b45309" stroke-width="0.8"/>
  <text x="48" y="46.8" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#78350f" text-anchor="middle">$</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4a38"/>
      <stop offset="100%" stop-color="#0a2e22"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="walletEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Dark emerald background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Cash bills fanning out -->
  <rect x="22" y="8" width="16" height="11" rx="2" transform="rotate(-12 30 13)" fill="#86efac" stroke="#166534" stroke-width="0.8"/>
  <circle cx="29" cy="12.5" r="2.5" fill="#22c55e" transform="rotate(-12 30 13)"/>
  <rect x="25" y="9" width="16" height="11" rx="2" transform="rotate(5 33 14)" fill="#a7f3d0" stroke="#166534" stroke-width="0.8"/>
  <circle cx="33" cy="14" r="2.5" fill="#34d399" transform="rotate(5 33 14)"/>

  <!-- Wallet body shadow -->
  <rect x="12" y="23" width="32" height="23" rx="5" fill="#22c55e" opacity="0.3" transform="translate(1,1)"/>

  <!-- Wallet body -->
  <rect x="12" y="22" width="32" height="23" rx="5" fill="url(#wallet)" stroke="#166534" stroke-width="1"/>

  <!-- Wallet top edge/fold -->
  <rect x="12" y="22" width="32" height="5" rx="3" fill="url(#walletEdge)" opacity="0.5"/>

  <!-- Wallet clasp -->
  <rect x="39" y="30" width="7" height="7" rx="3.5" fill="url(#walletEdge)"/>
  <circle cx="42.5" cy="33.5" r="1.5" fill="#0f4a38"/>

  <!-- Eyes (cute dot style matching OG) -->
  <circle cx="22" cy="32" r="2.2" fill="#166534"/>
  <circle cx="22.7" cy="31.3" r="0.7" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2.2" fill="#166534"/>
  <circle cx="32.7" cy="31.3" r="0.7" fill="#ffffff"/>

  <!-- Smile -->
  <path d="M22 37 Q27 41 33 37" stroke="#166534" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Gold coin -->
  <circle cx="46" cy="43" r="6" fill="url(#coin)" stroke="#b45309" stroke-width="0.8"/>
  <text x="46" y="45.5" font-family="system-ui, sans-serif" font-weight="900" font-size="7" fill="#78350f" text-anchor="middle">$</text>
</svg>